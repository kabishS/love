<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Quiz App</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
    }

    body{
        background: linear-gradient(135deg,#667eea,#764ba2);
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
    }

    .container{
        width:100%;
        max-width:700px;
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    #questionNo{
        font-size:14px;
        color:gray;
        margin-bottom:10px;
    }

    #question{
        font-size:22px;
        margin-bottom:20px;
        color:#222;
    }

    .option{
        width:100%;
        padding:15px;
        margin:10px 0;
        border:2px solid #ddd;
        border-radius:10px;
        cursor:pointer;
        transition:0.3s;
        background:white;
        text-align:left;
        font-size:16px;
    }

    .option:hover{
        background:#f5f5f5;
    }

    .correct{
        background:#4CAF50 !important;
        color:white;
        border-color:#4CAF50;
    }

    .wrong{
        background:#f44336 !important;
        color:white;
        border-color:#f44336;
    }

    #nextBtn{
        width:100%;
        padding:15px;
        margin-top:20px;
        border:none;
        border-radius:10px;
        background:#667eea;
        color:white;
        font-size:18px;
        cursor:pointer;
    }

    #nextBtn:hover{
        opacity:0.9;
    }

    #score{
        text-align:center;
        font-size:24px;
        margin-top:20px;
        color:#333;
    }
</style>
</head>
<body>

<div class="container">
    <h1>🧠 Aptitude Quiz App</h1>

    <div id="questionNo"></div>
    <div id="question">Loading Questions...</div>

    <div id="options"></div>

    <button id="nextBtn">Next Question</button>

    <div id="score"></div>
</div>

<script>
const questionNo = document.getElementById("questionNo");
const question = document.getElementById("question");
const options = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const scoreText = document.getElementById("score");

let questions = [];
let current = 0;
let score = 0;
let answered = false;

async function fetchQuestions(){
    const response = await fetch(
        "https://opentdb.com/api.php?amount=10&type=multiple"
    );

    const data = await response.json();
    questions = data.results;

    showQuestion();
}

function decodeHTML(html){
    const txt = document.createElement("textarea");
    txt.innerHTML = html;
    return txt.value;
}

function showQuestion(){
    answered = false;
    options.innerHTML = "";

    const q = questions[current];

    questionNo.innerText = `Question ${current + 1} / ${questions.length}`;
    question.innerHTML = decodeHTML(q.question);

    let answers = [...q.incorrect_answers, q.correct_answer];
    answers.sort(() => Math.random() - 0.5);

    answers.forEach(answer=>{
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerHTML = decodeHTML(answer);

        btn.onclick = () => {
            if(answered) return;

            answered = true;

            if(answer === q.correct_answer){
                btn.classList.add("correct");
                score++;
            }else{
                btn.classList.add("wrong");
            }

            document.querySelectorAll(".option").forEach(option=>{
                option.disabled = true;

                if(option.innerHTML === decodeHTML(q.correct_answer)){
                    option.classList.add("correct");
                }
            });
        };

        options.appendChild(btn);
    });
}

nextBtn.onclick = ()=>{
    if(current < questions.length - 1){
        current++;
        showQuestion();
    }else{
        questionNo.innerHTML = "";
        question.innerHTML = "🎉 Quiz Completed!";
        options.innerHTML = "";
        nextBtn.style.display = "none";
        scoreText.innerHTML = `Your Score: ${score} / ${questions.length}`;
    }
};

fetchQuestions();
</script>

</body>
</html>
